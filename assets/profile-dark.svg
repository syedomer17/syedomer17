<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" fill="none">
  <!-- Styles for Pure Dark Mode -->
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --text: #f0f6fc;
      --muted: #8b949e;
      --accent: #58a6ff;
      --green: #3fb950;
      --red: #f85149;
      --dots: #484f58;
    }
    .mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace;
    }
    .sans {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    .bg-canvas { fill: var(--bg); }
    .bg-panel { fill: var(--surface); }
    .text-main { fill: var(--text); }
    .text-accent { fill: var(--accent); }
    .text-dots { fill: var(--dots); }
    .text-muted { fill: var(--muted); }
    .text-green { fill: var(--green); }
    .text-red { fill: var(--red); }
    .border-main { stroke: var(--border); }

    /* Interactive Link Hover Styling */
    .term-link {
      text-decoration: none;
      cursor: pointer;
    }
    .term-link tspan {
      fill: var(--accent);
      transition: fill 0.15s ease;
    }
    .term-link:hover tspan {
      fill: var(--text);
      text-decoration: underline;
    }
  </style>

  <!-- Outer Canvas Background -->
  <rect width="1100" height="620" class="bg-canvas" />

  <!-- Outer Window Frame -->
  <rect x="20" y="20" width="1060" height="580" rx="6" class="bg-panel border-main" stroke-width="1.5" />

  <!-- macOS Window Controls -->
  <circle cx="40" cy="38" r="5" fill="#ff5f56" />
  <circle cx="55" cy="38" r="5" fill="#ffbd2e" />
  <circle cx="70" cy="38" r="5" fill="#27c93f" />

  <!-- Center Header Title -->
  <text x="550" y="42" text-anchor="middle" class="mono text-muted" font-size="11">syedomer17@macos-seq: ~ (profile.zsh)</text>
  <line x1="20" y1="55" x2="1080" y2="55" class="border-main" stroke-width="1.5" />

  <!-- ================= COLUMN 1 (LEFT) ================= -->
  
  <!-- Header Block (Avatar + Title Info) -->
  <g transform="translate(65, 80)">
    <!-- Geometric 4-Tier Architecture Avatar -->
    <g stroke="var(--accent)" stroke-width="1" fill="none">
      <line x1="30" y1="10" x2="15" y2="30" stroke-opacity="0.5" />
      <line x1="30" y1="10" x2="45" y2="30" stroke-opacity="0.5" />
      <line x1="15" y1="30" x2="15" y2="50" stroke-opacity="0.5" />
      <line x1="45" y1="30" x2="45" y2="50" stroke-opacity="0.5" stroke-dasharray="2,2" />
      <line x1="15" y1="30" x2="45" y2="50" stroke-opacity="0.2" />
      <line x1="45" y1="30" x2="15" y2="50" stroke-opacity="0.2" />
      <line x1="15" y1="50" x2="30" y2="70" stroke-opacity="0.5" />
      <line x1="45" y1="50" x2="30" y2="70" stroke-opacity="0.5" />

      <circle cx="30" cy="10" r="3.5" fill="var(--text)" stroke="var(--accent)" stroke-width="1.2" />
      <circle cx="15" cy="30" r="3.5" fill="var(--surface)" stroke="var(--accent)" stroke-width="1.2" />
      <circle cx="45" cy="30" r="3.5" fill="var(--surface)" stroke="var(--accent)" stroke-width="1.2" />
      <circle cx="15" cy="50" r="3.5" fill="var(--surface)" stroke="var(--accent)" stroke-width="1.2" />
      <circle cx="45" cy="50" r="3.5" fill="var(--surface)" stroke="var(--accent)" stroke-width="1.2" />
      <circle cx="30" cy="70" r="4.5" fill="var(--green)" stroke="var(--accent)" stroke-width="1.2" />
      <circle cx="30" cy="70" r="7.5" stroke="var(--green)" stroke-width="0.8" stroke-dasharray="1.5,1.5" stroke-opacity="0.6" />
    </g>

    <!-- Title Info -->
    <text x="70" y="20" class="sans text-main" font-size="15" font-weight="800">SYED OMER ALI</text>
    <text x="70" y="36" class="sans text-accent" font-size="9.5" font-weight="600" letter-spacing="0.5">FULL-STACK DEVELOPER · DEVSECOPS · AI/ML</text>
    <text x="70" y="50" class="mono text-muted" font-size="9">HOST: syedomer.me // PORT: 443</text>
    <text x="70" y="64" class="mono text-green" font-size="9"><tspan class="text-green">●</tspan> OPEN TO INTERNSHIPS / COLLABORATIONS</text>
  </g>

  <!-- Divider 1 -->
  <text x="65" y="170" class="mono text-dots" font-size="12">------------------------------------------------</text>

  <!-- Section: Engineering Profile -->
  <text x="65" y="190" class="mono text-main" font-size="12" font-weight="bold">[ ENGINEERING PROFILE ]</text>
  
  <g class="mono" font-size="12">
    <text x="65" y="215" class="text-accent">Role<tspan class="text-dots">........................</tspan><tspan class="text-main">Full-Stack Developer</tspan></text>
    <text x="65" y="237" class="text-accent">Focus<tspan class="text-dots">...................</tspan><tspan class="text-main">Backend · DevOps · AI/ML</tspan></text>
    <text x="65" y="259" class="text-accent">Location<tspan class="text-dots">........................</tspan><tspan class="text-main">Hyderabad, India</tspan></text>
    <text x="65" y="281" class="text-accent">Building<tspan class="text-dots">........</tspan><tspan class="text-main">Full-Stack Systems · AI Products</tspan></text>
  </g>

  <!-- Divider 2 -->
  <text x="65" y="306" class="mono text-dots" font-size="12">------------------------------------------------</text>

  <!-- Section: Network & Portfolio -->
  <text x="65" y="326" class="mono text-main" font-size="12" font-weight="bold">[ NETWORK &amp; PORTFOLIO ]</text>
  
  <g class="mono" font-size="12">
    <text x="65" y="351" class="text-accent">Portfolio<tspan class="text-dots">............................</tspan><a href="https://syedomer.me" target="_blank" class="term-link"><tspan>syedomer.me</tspan></a></text>
    <text x="65" y="373" class="text-accent">GitHub<tspan class="text-dots">.....................</tspan><a href="https://github.com/syedomer17" target="_blank" class="term-link"><tspan>github.com/syedomer17</tspan></a></text>
    <text x="65" y="395" class="text-accent">LinkedIn<tspan class="text-dots">..............</tspan><a href="https://www.linkedin.com/in/syedomer17" target="_blank" class="term-link"><tspan>linkedin.com/in/syedomer17</tspan></a></text>
    <text x="65" y="417" class="text-accent">Email<tspan class="text-dots">...................</tspan><a href="mailto:syedomerali2006@gmail.com" class="term-link"><tspan>syedomerali2006@gmail.com</tspan></a></text>
  </g>

  <!-- Divider 3 -->
  <text x="65" y="442" class="mono text-dots" font-size="12">------------------------------------------------</text>

  <!-- Section: Custom Terminal Status Section -->
  <g class="mono">
    <text x="65" y="467" class="text-main" font-size="12"><tspan class="text-accent">syedomer17@github</tspan> <tspan class="text-muted">~ %</tspan> status</text>
    <text x="65" y="489" class="text-green" font-weight="bold" font-size="12"><tspan class="text-green">●</tspan> BUILDING</text>
    <text x="65" y="509" class="text-muted" font-size="12">  Full-stack systems · DevOps · AI</text>
    <text x="65" y="529" class="text-muted" font-size="10.5">Last updated: <tspan id="updated">2026-08-20</tspan></text>
  </g>


  <!-- ================= COLUMN 2 (RIGHT) ================= -->

  <!-- Section: Development Environment -->
  <text x="575" y="95" class="mono text-main" font-size="12" font-weight="bold">[ DEVELOPMENT ENVIRONMENT ]</text>
  
  <g class="mono" font-size="12">
    <text x="575" y="120" class="text-accent">OS<tspan class="text-dots">.................................</tspan><tspan class="text-main">macOS / Linux</tspan></text>
    <text x="575" y="142" class="text-accent">Runtime<tspan class="text-dots">.....................</tspan><tspan class="text-main">Node.js / Go / Python</tspan></text>
    <text x="575" y="164" class="text-accent">Editor<tspan class="text-dots">...................................</tspan><tspan class="text-main">VS Code</tspan></text>
    <text x="575" y="186" class="text-accent">Containers<tspan class="text-dots">............................</tspan><tspan class="text-main">Docker</tspan></text>
    <text x="575" y="208" class="text-accent">CI/CD<tspan class="text-dots">.............................</tspan><tspan class="text-main">GitHub Actions</tspan></text>
  </g>

  <!-- Divider 1 -->
  <text x="575" y="230" class="mono text-dots" font-size="12">------------------------------------------------</text>

  <!-- Section: Tech Stack Categorization -->
  <text x="575" y="250" class="mono text-main" font-size="12" font-weight="bold">[ ENGINEERING STACK ]</text>
  
  <g class="mono" font-size="12">
    <text x="575" y="275" class="text-accent">Frontend<tspan class="text-dots">..............</tspan><tspan class="text-main">Next.js, React, TypeScript</tspan></text>
    <text x="575" y="297" class="text-accent">Backend<tspan class="text-dots">.............</tspan><tspan class="text-main">Node.js, Express, NestJS, Go</tspan></text>
    <text x="575" y="319" class="text-accent">Database<tspan class="text-dots">......</tspan><tspan class="text-main">MongoDB, PostgreSQL, Redis, Prisma</tspan></text>
    <text x="575" y="341" class="text-accent">DevOps<tspan class="text-dots">.............</tspan><tspan class="text-main">Docker, Linux, Nginx, Actions</tspan></text>
    <text x="575" y="363" class="text-accent">AI/ML<tspan class="text-dots">............</tspan><tspan class="text-main">Python, ML, LLM APIs, AI Agents</tspan></text>
  </g>

  <!-- Divider 2 -->
  <text x="575" y="385" class="mono text-dots" font-size="12">------------------------------------------------</text>

  <!-- Section: GitHub System Metrics -->
  <text x="575" y="405" class="mono text-main" font-size="12" font-weight="bold">[ GITHUB ACTIVITY ]</text>
  
  <g class="mono" font-size="12">
    <!-- Repos (Dynamic) -->
    <text x="575" y="430" class="text-accent">Repositories<tspan class="text-dots">..........................</tspan></text>
    <text id="repos" x="900" y="430" class="text-main" text-anchor="end">146</text>

    <!-- Stars (Dynamic) -->
    <text x="575" y="452" class="text-accent">Stars<tspan class="text-dots">.................................</tspan></text>
    <text id="stars" x="900" y="452" class="text-main" text-anchor="end">33</text>

    <!-- Contributions (Dynamic) -->
    <text id="contributions_label" x="575" y="474" class="text-accent">Contributions (3 Years)<tspan class="text-dots">...............</tspan></text>
    <text id="contributions" x="900" y="474" class="text-main" text-anchor="end">3,160</text>
  </g>

  <!-- Divider 3 -->
  <text x="575" y="496" class="mono text-dots" font-size="12">------------------------------------------------</text>
</svg>